name: Collect Data

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: data-collector/package-lock.json

      - name: Install dependencies
        working-directory: data-collector
        run: npm ci

      - name: Fetch latest price data from previous data branch (for history merging)
        run: |
          git fetch origin data --depth=1 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout origin/data -- data/latest-canonical.json 2>/dev/null || true
            echo "Restored previous data for history merging"
          fi

      - name: Run data collector
        working-directory: data-collector
        env:
          DATA_FILE: ${{ github.workspace }}/data/latest-canonical.json
        run: npm run collect

      - name: Publish data to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the collected data file (force-add because data/ is in .gitignore)
          git add -f data/latest-canonical.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update price data $(date -u +'%Y-%m-%d')"

          # Push only this commit to the data branch
          git push origin HEAD:data
