<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ninjaCompare – Austrian Grocery Price Comparison</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>🛒 ninjaCompare 🚚🚲</h1>
        <p class="subtitle">Compare prices across Austrian supermarkets and online shops</p>
    </header>

    <main>
        <!-- Controls -->
        <section class="controls">
            <input
                type="text"
                id="search"
                placeholder="Search products…"
                aria-label="Search products"
            />
            <div class="store-filters" id="store-filters" role="group" aria-label="Filter by store">
                <!-- Store checkboxes injected by JS -->
            </div>
            <select id="sort" aria-label="Sort by">
                <option value="name">Sort by name</option>
                <option value="price-asc">Price ↑</option>
                <option value="price-desc">Price ↓</option>
            </select>
            <button id="reload-btn" class="reload-btn" aria-label="Reload data" title="Reload data from server">⟳ Reload</button>
        </section>

        <!-- Stats bar -->
        <section class="stats" id="stats" aria-live="polite"></section>

        <!-- Product table -->
        <section class="table-wrapper" role="region" aria-label="Product list">
            <table id="products">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Store</th>
                        <th>Price (€)</th>
                        <th>Per unit</th>
                        <th>Organic</th>
                        <th class="basket-col-header"></th>
                    </tr>
                </thead>
                <tbody id="product-body">
                    <tr><td colspan="6" class="loading">Loading data…</td></tr>
                </tbody>
            </table>
        </section>

        <!-- Pagination -->
        <nav id="pagination" class="pagination" aria-label="Pagination"></nav>
    </main>

    <!-- Basket FAB -->
    <div id="basket-fab" class="basket-fab hidden">
        <button id="compare-btn" title="Compare basket prices">
            🛒 Compare <span id="basket-count" class="basket-count">0</span>
        </button>
    </div>

    <!-- Comparison Modal -->
    <div id="comparison-modal" class="comparison-modal hidden">
        <div class="comparison-content">
            <div class="comparison-header">
                <h2>🛒 Basket Comparison</h2>
                <div class="comparison-actions">
                    <label class="normalize-toggle" title="Show prices per kg/liter for easier comparison across different package sizes">
                        <input type="checkbox" id="normalize-toggle" />
                        <span class="normalize-toggle-slider"></span>
                        <span class="normalize-toggle-label">Per kg/l</span>
                    </label>
                    <button id="share-basket-btn" class="comparison-action-btn" title="Copy share link">🔗 Share</button>
                    <button id="clear-basket-btn" class="comparison-action-btn danger" title="Clear basket">🗑️ Clear</button>
                    <button id="close-comparison-btn" class="comparison-close-btn" title="Close">&times;</button>
                </div>
            </div>
            <div id="comparison-body" class="comparison-body"></div>
        </div>
    </div>

    <footer>
        <p>Data updated daily. Sources: Billa, Spar, Ninja, Velofood, Alfies Graz. &nbsp;|&nbsp; <a href="https://github.com/stefan2904/ninjaCompare-experiment" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
