version: "3.9"

services:

  # ─────────────────────────────────────────────────────────────────────────
  # Data Collector
  # Fetches product prices from Billa, Spar, Hofer, Ninja, Velofood, Alfies Graz and exposes them
  # via a JSON API on port 3001.
  # ─────────────────────────────────────────────────────────────────────────
  data-collector:
    build:
      context: ./data-collector
    container_name: ninjacompare-collector
    restart: unless-stopped
    environment:
      PORT: "3001"
      TZ: "Europe/Vienna"
    volumes:
      - collector-data:/app/data
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  collector-data:
